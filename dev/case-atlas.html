<!doctype html><html lang="zh"><meta charset="utf-8"><title>气脉 · 19路案例总览</title>
<style>body{margin:0;background:#192b29;color:#eee9dc;font:15px system-ui;padding:24px}h1{margin:0;font-size:23px}p{color:#bfcbbf;line-height:1.6}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;background:#304740;border:1px solid #5e7468;color:inherit;padding:8px;border-radius:5px}main{display:grid;grid-template-columns:min(65vw,780px,calc(100vh - 260px)) minmax(240px,1fr);gap:24px}canvas{width:100%;display:block;border-radius:5px}#legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:32vh;overflow:auto}#legend button{font-size:13px;padding:7px}#legend button{text-align:left}small{display:block;color:#b9cbbd;line-height:1.5}a{color:#d5dfb8}#detail{margin-top:16px}#detail canvas{max-width:min(480px,calc(100vh - 530px))}#board{position:relative} @media(max-width:900px){main{grid-template-columns:1fr}}</style>
<h1>气脉 · 19路案例总览</h1><p id="intro"></p>
<nav><select id="collection" aria-label="案例集合"><option value="basic">基础形体 · 黑白对照</option><option value="all">完整案例库</option></select><button id="prev">上一盘</button><select id="page" aria-label="案例棋盘"></select><button id="next">下一盘</button><button id="unfocus">取消关注</button><select id="version" aria-label="连接方案" hidden><option value="new">当前核心</option></select><label>局面 <select id="phase" aria-label="案例阶段"><option value="before">落子前</option><option value="after">案例终局</option></select></label><a href="/dev/influence-review.html">联系与盘面影响</a><a href="/dev/connection-lab.html">双子与交汇样板</a><a href="/dev/transition-review.html?presentation=1&prototype=1">19路实战预览</a></nav>
<main><section><div id="board"></div><small id="status"></small></section><aside><h2>本盘案例 · 点击关注并放大</h2><div id="legend"></div><div id="detail"></div></aside></main>
<script type="module">
import * as THREE from 'three';
import {parseSGF} from '/src/engine.ts';
import {packVisualCases} from './case-atlas.ts';
import {visualAtlasSurface} from './visual-atlas-model.ts';
const manifest=await(await fetch('/qi-mai/manifest.json')).json();
const items=await Promise.all(manifest.map(async item=>({...item,kifu:parseSGF(await(await fetch('/qi-mai/'+item.file)).text())})));
const basics=new Set(['line','elbow','tee','cross','diagonal','knight','small-jump','large-jump','three-around','four-around','crowded-hub','opposed-crossing']);
const basicItems=items.filter(item=>basics.has(item.id.replace(/-swap$/,'')));
const basicBoards=packVisualCases(basicItems),allBoards=packVisualCases(items);
const params=new URLSearchParams(location.search),collectionSelect=document.querySelector('#collection'),phaseSelect=document.querySelector('#phase');
collectionSelect.value=params.get('collection')==='all'?'all':'basic';phaseSelect.value=params.get('phase')==='after'?'after':'before';
let boards=collectionSelect.value==='all'?allBoards:basicBoards;
const pageSelect=document.querySelector('#page');
function boardOptions(){pageSelect.replaceChildren();boards.forEach((b,i)=>{const option=document.createElement('option');option.value=i;option.textContent=`第 ${i+1} / ${boards.length} 盘 · ${b.placements.length} 个案例`;pageSelect.append(option)});}
boardOptions();
document.querySelector('#intro').textContent=`基础形体 ${basicItems.length} 例集中展示；完整 ${items.length} 例共 ${allBoards.length} 盘。各案例独立判定规则，紧凑排列在19路展示盘上，案例间不会产生连接。`;

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1400,1400);renderer.toneMapping=THREE.ACESFilmicToneMapping;
const requestedBoard=Number(params.get('board')??1);
let selected=Math.max(0,Math.min(boards.length-1,Number.isFinite(requestedBoard)?Math.trunc(requestedBoard)-1:0));pageSelect.value=selected;
function syncUrl(){const url=new URL(location.href);url.searchParams.set('collection',collectionSelect.value);url.searchParams.set('board',String(selected+1));url.searchParams.set('phase',phaseSelect.value);history.replaceState(null,'',url);}
let chosen=null;
let pixelReport='',regionMetrics={};
function draw(game,live,focus=null){
 const scene=new THREE.Scene();scene.background=new THREE.Color('#d0b782');
 scene.add(live.mesh);
 const extent=focus?130:365,cx=focus?50+focus[0]*660/18:380,cy=focus?-50-focus[1]*660/18:-380;
 const camera=new THREE.OrthographicCamera(-extent,extent,extent,-extent,1,2000);camera.up.set(0,1,0);camera.position.set(cx,cy,1000);camera.lookAt(cx,cy,0);
 const pts=[];for(let i=0;i<19;i++){const p=50+i*660/18;pts.push(p,-50,0,p,-710,0,50,-p,0,710,-p,0)}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const mat=new THREE.LineBasicMaterial({color:0x9b8256});scene.add(new THREE.LineSegments(geo,mat));
 scene.remove(live.mesh);renderer.render(scene,camera);
 const refCanvas=document.createElement('canvas');refCanvas.width=1400;refCanvas.height=1400;const refCtx=refCanvas.getContext('2d');refCtx.drawImage(renderer.domElement,0,0);const reference=refCtx.getImageData(0,0,1400,1400).data;
 scene.add(live.mesh);renderer.render(scene,camera);const canvas=document.createElement('canvas');canvas.width=1400;canvas.height=1400;const ctx=canvas.getContext('2d');ctx.drawImage(renderer.domElement,0,0);
 if(!focus){
 const pixels=ctx.getImageData(0,0,1400,1400).data;let checked=0,present=0,totalStones=0;
 const spacing=660/18*700/365,innerRadius=.28*spacing,outerRadius=.5*spacing,innerSquared=innerRadius**2,outerSquared=outerRadius**2;
 const changed=(at,threshold)=>Math.max(Math.abs(pixels[at]-reference[at]),Math.abs(pixels[at+1]-reference[at+1]),Math.abs(pixels[at+2]-reference[at+2]))>threshold;
 const coordinate=i=>'ABCDEFGHJKLMNOPQRST'[i%19]+(19-Math.floor(i/19));
 for(let i=0;i<361;i++)if(game.board[i]){totalStones++;const px=Math.round(700+(i%19-9)*spacing),py=Math.round(700+(Math.floor(i/19)-9)*spacing);if(changed((py*1400+px)*4,20))present++;}
 let innerMax=0,ringMax=0,innerWorst='—',ringWorst='—';const innerOver=[],ringOver=[];
 // A thin, continuous strand may pass through an empty intersection. Measure
 // occupied area, not whether its exact centre is completely bare. Labels and
 // case boxes are painted only after this GPU comparison.
 for(let i=0;i<361;i++)if(!game.board[i]){
  const cx=700+(i%19-9)*spacing,cy=700+(Math.floor(i/19)-9)*spacing;
  let innerSamples=0,innerMaterial=0,ringSamples=0,ringMaterial=0;checked++;
  for(let py=Math.max(0,Math.floor(cy-outerRadius));py<=Math.min(1399,Math.ceil(cy+outerRadius));py++)for(let px=Math.max(0,Math.floor(cx-outerRadius));px<=Math.min(1399,Math.ceil(cx+outerRadius));px++){
   const radiusSquared=(px+.5-cx)**2+(py+.5-cy)**2;if(radiusSquared>outerSquared)continue;
   const material=changed((py*1400+px)*4,12);
   if(radiusSquared<=innerSquared){innerSamples++;if(material)innerMaterial++;}else{ringSamples++;if(material)ringMaterial++;}
  }
  const innerRatio=innerMaterial/innerSamples,ringRatio=ringMaterial/ringSamples;
  if(innerRatio>innerMax){innerMax=innerRatio;innerWorst=coordinate(i);}if(ringRatio>ringMax){ringMax=ringRatio;ringWorst=coordinate(i);}
  if(innerRatio>.20)innerOver.push(coordinate(i));if(ringRatio>.25)ringOver.push(coordinate(i));
 }
 regionMetrics={emptyCount:checked,stonesPresent:present,stonesTotal:totalStones,innerMax:(innerMax*100).toFixed(2),innerOver:innerOver.length,ringMax:(ringMax*100).toFixed(2),ringOver:ringOver.length};
 pixelReport=`棋子可见 ${present}/${totalStones} · 空点 ${checked} 处：半径0.28格内最坏占用 ${(innerMax*100).toFixed(1)}%（${innerWorst}），>20% ${innerOver.length} 处${innerOver.length?'［'+innerOver.join('、')+'］':''} · 0.28–0.5格环带最坏占用 ${(ringMax*100).toFixed(1)}%（${ringWorst}），>25% ${ringOver.length} 处${ringOver.length?'［'+ringOver.join('、')+'］':''} · 区域占用筛查，仍需目视`;
 ctx.font='19px system-ui';ctx.fillStyle='#57472f';ctx.textAlign='center';for(let i=0;i<19;i++){const p=700+(i-9)*660/18*700/365;ctx.fillText('ABCDEFGHJKLMNOPQRST'[i],p,1385);ctx.fillText(String(19-i),16,p+6)}
 boards[selected].placements.forEach((p,i)=>{const [x,y,r,b]=p.bounds,px=700+((x+r)/2-9)*660/18*700/365,py=700+((y+b)/2-9)*660/18*700/365;ctx.strokeStyle='#8e7953';ctx.lineWidth=1;ctx.setLineDash([5,7]);ctx.strokeRect(700+(x-9-.65)*660/18*700/365,700+(y-9-.65)*660/18*700/365,(r-x+1.3)*660/18*700/365,(b-y+1.3)*660/18*700/365);ctx.setLineDash([]);ctx.fillStyle='#354c40';ctx.beginPath();ctx.arc(px,py-(b-y+1.5)*660/18*350/365,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(String(i+1),px,py-(b-y+1.5)*660/18*350/365+7)});
 }
 geo.dispose();mat.dispose();return canvas;
}
function render(){
 syncUrl();
 const b=boards[selected],mode=phaseSelect.value;
 const {game:g,live}=visualAtlasSurface(b,mode==='after',chosen===null?undefined:b.placements[chosen]?.item.id);
 document.querySelector('#board').replaceChildren(draw(g,live));
 document.querySelector('#detail').replaceChildren();
 if(chosen!==null&&b.placements[chosen]){const [l,t,r,bottom]=b.placements[chosen].bounds;document.querySelector('#detail').replaceChildren(draw(g,live,[(l+r)/2,(t+bottom)/2]));}
 live.dispose();
 const legend=document.querySelector('#legend');legend.replaceChildren();b.placements.forEach((p,i)=>{const button=document.createElement('button');button.textContent=`${i+1}. ${p.item.name}`;button.onclick=()=>{chosen=i;render()};legend.append(button)});
 const status=document.querySelector('#status');status.textContent=`第 ${selected+1} 盘 · ${b.placements.length} 个独立案例 · ${g.board.filter(Boolean).length} 子 · ${pixelReport}。${chosen===null?'默认展示':'已关注所选案例的第一块棋'}；小飞关注后才展开。虚线仅定位，不属于气脉。`;for(const [key,value] of Object.entries(regionMetrics))status.dataset[key]=String(value);
}
document.querySelector('#unfocus').onclick=()=>{chosen=null;render()};
document.querySelector('#collection').onchange=()=>{chosen=null;selected=0;boards=document.querySelector('#collection').value==='basic'?basicBoards:allBoards;boardOptions();pageSelect.value=0;render()};
pageSelect.onchange=()=>{chosen=null;selected=Number(pageSelect.value);render()};for(const id of ['phase','version'])document.querySelector('#'+id).onchange=()=>{render()};
document.querySelector('#prev').onclick=()=>{chosen=null;selected=Math.max(0,selected-1);pageSelect.value=selected;render()};document.querySelector('#next').onclick=()=>{chosen=null;selected=Math.min(boards.length-1,selected+1);pageSelect.value=selected;render()};render();
</script></html>
