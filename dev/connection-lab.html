<!doctype html><html lang="zh"><meta charset="utf-8"><title>气脉 · 局部连接样板</title>
<style>body{margin:0;padding:28px;background:#192b29;color:#eee9dc;font:16px system-ui}h1{font-size:23px;margin:0 0 10px}p{color:#bcc7be;line-height:1.6}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}select,button{font:inherit;color:inherit;background:#304641;border:1px solid #607269;border-radius:5px;padding:8px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:#243a34;padding:16px;border-radius:9px}h2{margin:0 0 12px;font-size:17px}canvas{width:100%;display:block;border-radius:4px}small{display:block;margin-top:14px;color:#b8c8be}a{color:#d5dfb8}</style>
<h1>气脉 · 局部连接样板</h1><p>棋子本体与材质保持一致。样板连接贴在侧下方，先合成局部轮廓，再与棋子融合一次。与主游戏共用同一套全长连接几何。</p>
<nav><a href="/dev/case-atlas.html">全部案例 · 19路总览</a><label>局面 <select aria-label="样板局面" id="case"><option value="solid">双子实连</option><option value="diagonal">斜连</option><option value="jump">小跳</option><option value="three" selected>三子围空</option><option value="four">四向交汇</option><option value="hub">五向受压交汇</option></select></label><label>方案 <select aria-label="连接方案" id="version"><option value="new">当前核心 · 直向连接</option></select></label><label>视角 <select aria-label="样板视角" id="angle"><option value="top">正俯视</option><option value="side">侧看厚度</option></select></label><button id="all">查看全部对照</button></nav>
<main id="gallery"></main><small id="status"></small>
<script type="module">
import * as THREE from 'three';
import {Go} from '/src/engine.ts';
import {createLivingSurface} from '/src/living-stones.ts';
const cases={solid:[[8,9],[9,9]],diagonal:[[8,9],[9,8]],jump:[[8,9],[10,9]],three:[[9,8],[10,9],[9,10]],four:[[9,8],[10,9],[9,10],[8,9]],hub:[[9,9],[10,8],[10,10],[8,8],[8,10],[11,9]]};
const names={solid:'双子实连',diagonal:'斜连',jump:'小跳',three:'三子围空',four:'四向交汇',hub:'五向受压交汇'};
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1000,720);renderer.toneMapping=THREE.ACESFilmicToneMapping;
let all=false;
function render(){
 const gallery=document.querySelector('#gallery');gallery.replaceChildren();
 const prototype=document.querySelector('#version').value==='new',side=document.querySelector('#angle').value==='side';
 for(const key of all?Object.keys(cases):[document.querySelector('#case').value])for(const color of [2,1]){
  const g=new Go(19);for(const [x,y] of cases[key])g.board[y*19+x]=color;
  if(key==='hub')for(const y of [8,10])g.board[y*19+9]=3-color;
  const live=createLivingSurface(g,[],false,0,false,new Map(),new Map(),prototype);
  const scene=new THREE.Scene();scene.background=new THREE.Color('#d0b782');scene.add(live.mesh);
  const s=660/18,cx=50+9*s,cy=-50-9*s,extent=2.55*s;
  const camera=new THREE.OrthographicCamera(-extent,extent,extent*.72,-extent*.72,1,2000);camera.up.set(0,1,0);camera.position.set(cx,cy-(side?420:0),side?750:1000);camera.lookAt(cx,cy,0);
  const pts=[];for(let i=0;i<19;i++){const p=50+i*s;pts.push(p,-50,0,p,-710,0,50,-p,0,710,-p,0)}
  const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const material=new THREE.LineBasicMaterial({color:0xa68e60});scene.add(new THREE.LineSegments(geometry,material));
  renderer.render(scene,camera);
  const article=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas');title.textContent=names[key]+' · '+(color===2?'白棋':'黑棋');canvas.width=1000;canvas.height=720;canvas.getContext('2d').drawImage(renderer.domElement,0,0);article.append(title,canvas);gallery.append(article);
  live.dispose();geometry.dispose();material.dispose();
 }
 document.querySelector('#status').textContent=(prototype?'当前核心':'当前核心')+' · 相同棋子、相同光照、相同局面；虚连不等于实连或成眼。';
}
for(const id of ['case','version','angle'])document.getElementById(id).onchange=()=>{all=false;render()};document.querySelector('#all').onclick=()=>{all=!all;render()};render();
</script></html>
