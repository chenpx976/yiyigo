<!doctype html><html lang="zh"><meta charset="utf-8"><title>19路真实棋谱过渡检查</title>
<style>body{margin:0;padding:24px;background:#172b29;color:#eee8d8;font:16px system-ui}h1{font-size:21px}select,button,input{margin:8px;font:inherit}main{display:flex;gap:24px}#full{width:62%}#detail{width:36%}canvas{width:100%}p{color:#bbcbc4}</style>
<h1>19 路真实棋谱 · 连接过渡开发检查</h1><p>古力 × 周睿羊，2015 春兰杯决赛。左：完整棋盘；右：目标连接局部。使用游戏同一曲面与状态数据。</p>
<label>事件<select id="event" aria-label="棋谱事件"></select></label><label>操作<select id="mode" aria-label="回放操作"><option value="step">单手过渡</option><option value="rapid">快速落子／悔棋</option></select></label><button id="play">播放过渡</button><label>进度<input aria-label="过渡进度" id="phase" type="range" min="0" max="100" step="1" value="0"></label><output id="status"></output>
<main><section id="full"></section><section id="detail"></section></main>
<script type="module">
import * as THREE from 'three';
import {Go,parseSGF} from '/src/engine.ts';
import {createLivingSurface as buildSurface} from '/src/living-stones.ts';
const prototype=new URLSearchParams(location.search).has('prototype');
const createLivingSurface=(...args)=>buildSurface(...args,prototype);
if(prototype)document.querySelector('p').textContent='古力 × 周睿羊，2015 春兰杯决赛。当前气脉核心实战检查，左：19路棋盘；右：局部。';
import {transitionCases} from './transition-cases.ts';
const kifu=parseSGF(await (await fetch('/games/gu.sgf')).text());
const cases=transitionCases(kifu,new URLSearchParams(location.search).has('presentation')),select=document.querySelector('#event'),phase=document.querySelector('#phase'),status=document.querySelector('#status');
const mode=document.querySelector('#mode');
const names={hide:'弱跳连退隐',reveal:'替代路径受损后恢复',cut:'切断',merge:'虚连变实连',atari:'打吃收紧'};
for(const c of cases){const o=document.createElement('option');o.value=c.key;o.textContent=`${c.color===1?'黑棋':'白棋'} · ${names[c.kind]} · 第 ${c.move} 手`;select.append(o);}
const scene=new THREE.Scene();scene.background=new THREE.Color('#172b29');
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.1));
const plane=new THREE.Mesh(new THREE.PlaneGeometry(720,720),new THREE.MeshBasicMaterial({color:0xd7b780}));plane.position.set(380,-380,-.1);scene.add(plane);
const coords=[];for(let i=0;i<19;i++){const p=50+i*660/18;coords.push(p,-50,0,p,-710,0,50,-p,0,710,-p,0);}
const grid=new THREE.BufferGeometry();grid.setAttribute('position',new THREE.Float32BufferAttribute(coords,3));scene.add(new THREE.LineSegments(grid,new THREE.LineBasicMaterial({color:0x806b48,transparent:true,opacity:.55})));
const views=['full','detail'].map(id=>{const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(2);r.setSize(id==='full'?760:440,id==='full'?760:440);r.toneMapping=THREE.ACESFilmicToneMapping;document.querySelector('#'+id).append(r.domElement);const size=id==='full'?390:90;const c=new THREE.OrthographicCamera(-size,size,size,-size,1,2000);c.up.set(0,1,0);return {r,c,id};});
let live,playing=false,started=0;
function show(reset=true){
 if(reset){phase.value='0';playing=false;}
 const c=cases.find(x=>x.key===select.value),g=new Go(19),connections=new Map(),surfaces=new Map(),rapid=mode.value==='rapid',time=1+Number(phase.value)/100*(rapid?1.1:.7);
 for(const m of kifu.moves.slice(0,c.move-1))g.play(m.i,m.color);
 const seed=createLivingSurface(g,[],false,0,false,connections,surfaces);seed.dispose();
 const m=kifu.moves[c.move-1],steps=rapid?[1,1.12,1.22,1.34]:[1];
 for(const [step,t] of steps.entries())if(t<=time){const old=g.board.slice();if(step%2===0)g.play(m.i,m.color);else g.undo();const intermediate=createLivingSurface(g,old,true,t,true,connections,surfaces);intermediate.dispose();}
 if(live){scene.remove(live.mesh);live.dispose();}
 live=createLivingSurface(g,g.board,false,time,true,connections,surfaces);live.setTime(time);scene.add(live.mesh);
 const x=50+((c.i%19+c.j%19)/2)*660/18,y=-50-((Math.floor(c.i/19)+Math.floor(c.j/19))/2)*660/18;
 for(const v of views){const cx=v.id==='full'?380:x,cy=v.id==='full'?-380:y;v.c.position.set(cx,cy,1000);v.c.lookAt(cx,cy,0);}
 status.textContent=`${phase.value}%`;
 // Manual frame inspection must also render when this background tab has no rAF ticks.
 for(const v of views)v.r.render(scene,v.c);
}
select.onchange=()=>show();mode.onchange=()=>show();phase.oninput=()=>{playing=false;show(false)};
document.querySelector('#play').onclick=()=>{playing=true;started=performance.now();};show();
function frame(t){if(playing){phase.value=String(Math.min(100,(t-started)/(mode.value==='rapid'?11:7)));show(false);if(Number(phase.value)===100)playing=false;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
