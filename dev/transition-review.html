<!doctype html><html lang="zh"><meta charset="utf-8"><title>19路真实棋谱过渡检查</title>
<style>body{margin:0;padding:24px;background:#172b29;color:#eee8d8;font:16px system-ui}h1{font-size:21px}select,button,input{margin:8px;font:inherit}main{display:flex;gap:24px}#full{width:62%}#detail{width:36%}canvas{width:100%}p{color:#bbcbc4;line-height:1.5}#verification{display:block;margin:10px 0;color:#d6ddc8;font-size:14px}nav{display:flex;align-items:center;flex-wrap:wrap}</style>
<h1>19 路真实棋谱 · 连接过渡开发检查</h1><p id="intro"></p>
<nav><label>棋谱<select id="game" aria-label="真实棋谱"></select></label><label>类别<select id="category" aria-label="事件类别"><option value="tactical">切断、拉通与打吃</option><option value="presentation">退隐与恢复</option></select></label><label>事件<select id="event" aria-label="棋谱事件"></select></label><label>操作<select id="mode" aria-label="回放操作"><option value="step">单手过渡</option><option value="rapid">快速落子／悔棋</option></select></label><button id="play">播放过渡</button><label>进度<input aria-label="过渡进度" id="phase" type="range" min="0" max="100" step="1" value="0"></label><output id="status"></output></nav>
<output id="verification" aria-live="polite"></output>
<main><section id="full"></section><section id="detail"></section></main>
<script type="module">
import * as THREE from 'three';
import {Go,parseSGF} from '/src/engine.ts';
import {createLivingSurface} from '/src/living-stones.ts';
import {transitionCases} from './transition-cases.ts';
const params=new URLSearchParams(location.search);
const games={gu:'古力 × 周睿羊 · 2015 春兰杯决赛',cho:'赵治勋 × 曹薰铉 · 2015 纪念对局',lee:'李世石 × 陈耀烨 · 2013 三星杯'};
const requestedGame=params.get('game'),gameId=Object.hasOwn(games,requestedGame)?requestedGame:'gu';
const gameSelect=document.querySelector('#game'),category=document.querySelector('#category');
for(const [id,name] of Object.entries(games)){const o=document.createElement('option');o.value=id;o.textContent=name;gameSelect.append(o);}
gameSelect.value=gameId;category.value=params.has('presentation')?'presentation':'tactical';
document.querySelector('#intro').textContent=games[gameId]+'。左：完整19路；右：目标连接局部。与游戏共用曲面和状态机。快速模式终态对照同一时刻的干净重建画面；像素一致仅验证复原，形态仍须目视检查。';
const kifu=parseSGF(await (await fetch('/games/'+gameId+'.sgf')).text());
const cases=transitionCases(kifu,category.value==='presentation'),select=document.querySelector('#event'),phase=document.querySelector('#phase'),status=document.querySelector('#status'),verification=document.querySelector('#verification'),mode=document.querySelector('#mode');
const names={hide:'弱跳连退隐',reveal:'替代路径受损后恢复',cut:'切断',merge:'虚连变实连',atari:'打吃收紧'};
for(const c of cases){const o=document.createElement('option');o.value=c.key;o.textContent=`${c.color===1?'黑棋':'白棋'} · ${names[c.kind]} · 第 ${c.move} 手`;select.append(o);}
if(cases.some(c=>c.key===params.get('event')))select.value=params.get('event');
mode.value=params.get('mode')==='rapid'?'rapid':'step';
const initialPhase=Number(params.get('phase')??0);phase.value=String(Number.isFinite(initialPhase)?Math.max(0,Math.min(100,initialPhase)):0);
function syncUrl(){
 const url=new URL(location.href);url.searchParams.set('game',gameId);url.searchParams.set('event',select.value);url.searchParams.set('mode',mode.value);url.searchParams.set('phase',phase.value);
 if(category.value==='presentation')url.searchParams.set('presentation','1');else url.searchParams.delete('presentation');
 history.replaceState(null,'',url);
}
function changeSource(){const url=new URL(location.href);url.searchParams.set('game',gameSelect.value);url.searchParams.delete('event');url.searchParams.set('phase','0');if(category.value==='presentation')url.searchParams.set('presentation','1');else url.searchParams.delete('presentation');location.assign(url.href);}
gameSelect.onchange=changeSource;category.onchange=changeSource;
const scene=new THREE.Scene();scene.background=new THREE.Color('#172b29');
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.1));
const plane=new THREE.Mesh(new THREE.PlaneGeometry(720,720),new THREE.MeshBasicMaterial({color:0xd7b780}));plane.position.set(380,-380,-.1);scene.add(plane);
const coords=[];for(let i=0;i<19;i++){const p=50+i*660/18;coords.push(p,-50,0,p,-710,0,50,-p,0,710,-p,0);}
const grid=new THREE.BufferGeometry();grid.setAttribute('position',new THREE.Float32BufferAttribute(coords,3));scene.add(new THREE.LineSegments(grid,new THREE.LineBasicMaterial({color:0x806b48,transparent:true,opacity:.55})));
const views=['full','detail'].map(id=>{
 const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(2);r.setSize(id==='full'?760:440,id==='full'?760:440);r.toneMapping=THREE.ACESFilmicToneMapping;document.querySelector('#'+id).append(r.domElement);
 const size=id==='full'?390:90,c=new THREE.OrthographicCamera(-size,size,size,-size,1,2000);c.up.set(0,1,0);
 const capture=document.createElement('canvas');capture.width=r.domElement.width;capture.height=r.domElement.height;const ctx=capture.getContext('2d',{willReadFrequently:true});
 return {r,c,id,capture,ctx};
});
function pixels(view){view.ctx.clearRect(0,0,view.capture.width,view.capture.height);view.ctx.drawImage(view.r.domElement,0,0);return view.ctx.getImageData(0,0,view.capture.width,view.capture.height).data;}
let live,playing=false,started=0;
function show(reset=true){
 if(reset){phase.value='0';playing=false;}
 const c=cases.find(x=>x.key===select.value),g=new Go(19),connections=new Map(),surfaces=new Map(),rapid=mode.value==='rapid',time=1+Number(phase.value)/100*(rapid?1.1:.7);
 if(!c){verification.textContent='此棋谱没有可展示的该类事件。';return;}
 for(const m of kifu.moves.slice(0,c.move-1))g.play(m.i,m.color);
 const originalBoard=g.board.slice();
 const seed=createLivingSurface(g,[],false,0,false,connections,surfaces);seed.dispose();
 const m=kifu.moves[c.move-1],steps=rapid?[1,1.12,1.22,1.34]:[1];
 for(const [step,t] of steps.entries())if(t<=time){const old=g.board.slice();if(step%2===0){const error=g.play(m.i,m.color);if(error)throw new Error(error);}else g.undo();const intermediate=createLivingSurface(g,old,true,t,true,connections,surfaces);intermediate.dispose();}
 if(live){scene.remove(live.mesh);live.dispose();}
 live=createLivingSurface(g,g.board,false,time,true,connections,surfaces);live.setTime(time);scene.add(live.mesh);
 const x=50+((c.i%19+c.j%19)/2)*660/18,y=-50-((Math.floor(c.i/19)+Math.floor(c.j/19))/2)*660/18;
 for(const v of views){const cx=v.id==='full'?380:x,cy=v.id==='full'?-380:y;v.c.position.set(cx,cy,1000);v.c.lookAt(cx,cy,0);v.r.render(scene,v.c);}
 status.textContent=`${phase.value}% · ${time.toFixed(2)}s`;
 verification.removeAttribute('data-residue-pixels');verification.removeAttribute('data-board-restored');
 if(rapid&&Number(phase.value)===100){
  const actual=views.map(pixels),cleanConnections=new Map(),cleanSurfaces=new Map();
  const cleanSeed=createLivingSurface(g,[],false,0,false,cleanConnections,cleanSurfaces);cleanSeed.dispose();
  const clean=createLivingSurface(g,[],false,time,true,cleanConnections,cleanSurfaces);clean.setTime(time);
  scene.remove(live.mesh);scene.add(clean.mesh);
  const comparisons=views.map((v,index)=>{v.r.render(scene,v.c);const expected=pixels(v),observed=actual[index];let changed=0,maxDifference=0;
   for(let p=0;p<observed.length;p+=4){const delta=Math.max(Math.abs(observed[p]-expected[p]),Math.abs(observed[p+1]-expected[p+1]),Math.abs(observed[p+2]-expected[p+2]));if(delta>2)changed++;maxDifference=Math.max(maxDifference,delta);}
   return {name:v.id==='full'?'全盘':'局部',changed,maxDifference};
  });
  scene.remove(clean.mesh);clean.dispose();scene.add(live.mesh);for(const v of views)v.r.render(scene,v.c);
  const restored=g.board.every((color,i)=>color===originalBoard[i]),residue=comparisons.reduce((n,c)=>n+c.changed,0);
  verification.dataset.residuePixels=String(residue);verification.dataset.boardRestored=String(restored);
  verification.textContent=`快速往返终态 · 棋局${restored?'已复原':'未复原'} · ${comparisons.map(c=>`${c.name}差异 ${c.changed}px（最大 RGB 差 ${c.maxDifference}）`).join(' · ')} · 差异阈值 > 2 / 255。`;
 }else verification.textContent=rapid?'快速往返中间帧：120 / 100 / 120ms 间隔；到100%才执行终态复原对照。':'单手过渡：检查根部、收腰、切断及拉通；快速模式另有终态像素复原对照。';
 syncUrl();
}
select.onchange=()=>show();mode.onchange=()=>show();phase.oninput=()=>{playing=false;show(false)};
document.querySelector('#play').onclick=()=>{playing=true;started=performance.now();};show(false);
function frame(t){if(playing){phase.value=String(Math.min(100,(t-started)/(mode.value==='rapid'?11:7)));show(false);if(Number(phase.value)===100)playing=false;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
